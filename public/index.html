<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentic Council</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="frame">
      <header class="topbar">
        <div class="topbar__left">
          <div class="topic-pill">
            <span class="dot"></span>
            <span id="topic-text">Current Topic: Awaiting update</span>
          </div>
        </div>
        <div class="topbar__center">
          AGENTIC COUNCIL
          <div class="status-strip" aria-live="polite">
            <span class="status-item" id="status-model">model: n/a</span>
          </div>
        </div>
        <div class="topbar__right"></div>
      </header>

      <main class="layout">
        <section class="panel feed" id="feed-list">
          <div class="feed-actions" id="feed-actions">
            <div class="provider-config-box" id="provider-config-box">
              <div class="config-field">
                <label for="provider-select" class="config-label">
                  <span>Provider</span>
                  <span class="config-label-sub" id="provider-badge">Cloud</span>
                </label>
                <div class="config-select-wrapper">
                  <select class="config-select" id="provider-select">
                    <option value="openrouter">OpenRouter</option>
                    <option value="openai">OpenAI</option>
                    <option value="anthropic">Anthropic</option>
                    <option value="groq">Groq</option>
                    <option value="lmstudio">LM Studio</option>
                  </select>
                </div>
              </div>

              <div class="config-field" id="model-config-field">
                <label for="model-select" class="config-label" id="model-field-label">
                  <span>Model</span>
                </label>
                <!-- Dropdown for cloud providers -->
                <div class="config-select-wrapper" id="model-select-wrapper">
                  <select class="config-select" id="model-select">
                    <!-- Populated dynamically from the provider -->
                  </select>
                </div>
                <!-- Free-form text input for LM Studio -->
                <div class="config-input-wrapper" id="model-input-wrapper" style="display: none;">
                  <input
                    type="text"
                    class="config-input"
                    id="model-input"
                    placeholder="e.g. qwen2.5-7b-instruct, local-model"
                    autocomplete="off"
                    spellcheck="false"
                  />
                </div>
              </div>

              <div class="config-field" id="api-key-field">
                <label for="api-key-input" class="config-label">
                  <span>API Key</span>
                  <span class="config-label-sub" id="api-key-hint">Required</span>
                </label>
                <div class="config-input-wrapper with-icon">
                  <input
                    type="password"
                    class="config-input"
                    id="api-key-input"
                    placeholder="sk-..."
                    autocomplete="off"
                    spellcheck="false"
                  />
                  <button type="button" class="config-icon-btn" id="toggle-key-visibility" title="Toggle visibility" aria-label="Toggle API Key visibility">
                    <svg class="eye-icon eye-open" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg class="eye-icon eye-closed" style="display:none;" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                      <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                  </button>
                </div>
              </div>

              </div>

            <button class="feed-btn" id="fetch-next" type="button">Begin Simulation</button>
          </div>
          <div class="feed-body" id="feed-body">
            <div class="feed-empty" id="feed-empty">Simulate any Policy</div>
          </div>
          <div class="feed-controls" aria-label="Policy details">
            <textarea
              class="feed-input feed-input--primary"
              id="topic-input"
              placeholder="Type in details of a policy"
              aria-label="Policy details"
              rows="2"
            ></textarea>
          </div>
        </section>

        <section class="panel map">
          <div class="map-grid"></div>
          <div id="india-map" class="map-canvas" aria-label="India state map"></div>
          <div class="map-dots"></div>
        </section>

        <section class="panel deliberation" id="deliberation-list">
          <div class="agent-card muted">
            <div class="agent-avatar"></div>
            <div>
              <div class="agent-name">Council booting...</div>
                <div class="agent-speech">Waiting for simulation signal.</div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/js/app.js"></script>
  </body>
</html>
